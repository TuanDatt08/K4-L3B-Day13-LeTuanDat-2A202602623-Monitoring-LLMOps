alerts:
  - name: HighLatencyP95
    severity: warning
    # Hạ từ 3000 xuống 2000 sau challenge rag_slow: P95 ~2650ms không kích hoạt alert cũ.
    condition: 'p95(response_sent.latency_ms) > 2000'
    duration: 5m
    type: symptom-based
    channel: slack
    slack_channel: '#k4-l3b-alerts'
    owner: student-2A202602623
    runbook: docs/alerts.md#alert-1
  - name: HighErrorRateOrRetrievalFailure
    severity: critical
    condition: 'count(request_failed) / count(request_received) * 100 > 2 or retrieval_success_rate_pct < 90'
    duration: 5m
    type: symptom-based
    channel: slack
    slack_channel: '#k4-l3b-alerts'
    owner: student-2A202602623
    runbook: docs/alerts.md#alert-2
  - name: CostOrTokenSpike
    severity: warning
    condition: 'sum(response_sent.cost_usd) by 1m > 2 * baseline_cost_per_min or avg(response_sent.tokens_out) > 400'
    duration: 10m
    type: symptom-based
    channel: slack
    slack_channel: '#k4-l3b-alerts'
    owner: student-2A202602623
    runbook: docs/alerts.md#alert-3
